spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:transaction_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

rikkeibank:
  kafka:
    create-topics: false
  jwt:
    secret: "RikkeiBankApiSecretKeyDungChungChoGatewayVaCacMicroservice2026!!"
  internal-key: "test-internal-key"

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.rikkeibank.transaction.exception.BusinessException
