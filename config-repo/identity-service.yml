spring:
  datasource:
    url: jdbc:mysql://${rikkeibank.mysql.host}:${rikkeibank.mysql.port}/rikkeibank_identity_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${rikkeibank.mysql.username}
    password: ${rikkeibank.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

logging:
  level:
    com.rikkeibank.identity: INFO
