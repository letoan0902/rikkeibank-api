spring:
  datasource:
    url: jdbc:mysql://${rikkeibank.mysql.host}:${rikkeibank.mysql.port}/rikkeibank_transaction_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${rikkeibank.mysql.username}
    password: ${rikkeibank.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 10000
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
      client:
        config:
          account-service:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.rikkeibank.transaction.exception.BusinessException

management:
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.rikkeibank.transaction: INFO
