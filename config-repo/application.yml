eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    registry-fetch-interval-seconds: 5

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 1s

rikkeibank:
  mysql:
    host: localhost
    port: 3307
    username: root
    password: "123456"
  jwt:
    secret: "RikkeiBankApiSecretKeyDungChungChoGatewayVaCacMicroservice2026!!"
    access-token-minutes: 15
    refresh-token-days: 30
  internal-key: "rikkeibank-internal-key-2026"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%15.15t] %-40.40logger{39} : %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%15.15t] %-40.40logger{39} : %msg%n"
